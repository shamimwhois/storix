name: Autonomous Engineering Task
description: Submit a scoped task for the Storix agent-intake workflow.
title: "[AI Task]: "
labels: ["ai-task"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is task intake only. Labeling it `ai-task` prepares a context artifact; it does not start an AI agent or authorize repository writes.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should be delivered?
      placeholder: Describe the desired result and why it is needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List verifiable completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out of scope
      description: Include compatibility, security, and operational constraints.
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Requested agent mode
      options:
        - ask
        - plan
        - auto
      default: 1
    validations:
      required: true
