name: Autonomous Engineering — Task Intake

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to prepare for an agent
        required: true
        type: number
      mode:
        description: Requested execution mode (intake metadata only)
        required: true
        type: choice
        options: [ask, plan, auto]

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomous-task-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare-task:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate task
        id: task
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(core.getInput('issue_number'))
              : context.issue.number;

            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('A valid issue_number is required.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: issueNumber,
            });

            if (issue.pull_request) {
              core.setFailed('Autonomous task intake accepts issues, not pull requests.');
              return;
            }

            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const requestedMode = (issue.body || '').match(/### Requested agent mode\s+([\s\S]*?)(?:\n### |$)/i)?.[1]?.trim().split(/\s+/)[0];
            const allowedModes = ['ask', 'plan', 'auto'];
            const mode = context.eventName === 'workflow_dispatch'
              ? core.getInput('mode')
              : (allowedModes.includes(requestedMode) ? requestedMode : 'plan');

            if (context.eventName !== 'workflow_dispatch' && !labels.includes('ai-task')) {
              core.setFailed('Add the ai-task label to opt in to task intake.');
              return;
            }

            const task = {
              schema_version: 1,
              repository: context.repo,
              issue_number: issue.number,
              issue_url: issue.html_url,
              title: issue.title,
              body: issue.body || '',
              labels,
              requested_mode: mode,
              execution_status: 'prepared_not_executed',
              created_at: new Date().toISOString(),
              base_ref: context.payload.repository.default_branch,
              safety: {
                code_write_enabled: false,
                merge_enabled: false,
                deployment_enabled: false,
                human_review_required: true
              }
            };

            core.setOutput('issue_number', String(issue.number));
            core.setOutput('task_json', JSON.stringify(task));
            core.setOutput('title', issue.title);
            core.setOutput('mode', mode);

      - name: Write task context artifact
        env:
          TASK_JSON: ${{ steps.task.outputs.task_json }}
        run: |
          mkdir -p autonomous-task
          printf '%s' "$TASK_JSON" | jq . > autonomous-task/task-context.json

      - name: Upload task context
        uses: actions/upload-artifact@v4
        with:
          name: storix-agent-task-${{ steps.task.outputs.issue_number }}
          path: autonomous-task/task-context.json
          if-no-files-found: error
          retention-days: 14

      - name: Mark task as prepared
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number("${{ steps.task.outputs.issue_number }}");
            const mode = "${{ steps.task.outputs.mode }}";

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: [
                '### Storix Autonomous Engineering — task prepared',
                '',
                'A versioned task-context artifact has been created for the external agent runner.',
                '',
                '- Requested mode: `' + mode + '`',
                '- Execution: **not started**',
                '- Repository writes: **disabled**',
                '- Merge/deployment: **disabled**',
                '',
                'Download the `storix-agent-task-' + issueNumber + '` workflow artifact and pass it to an explicitly configured, permission-scoped agent runner. Review the plan and diff before enabling any write-capable execution.'
              ].join('\n')
            });
